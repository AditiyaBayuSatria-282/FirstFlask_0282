<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flask POST Sederhana</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
</head>
<body>
    <div class="container">
        <h1>Form Flask (Method POST)</h1>

        <form method="POST" action="/">
            <label for="nama">Masukkan nama:</label>
            <input type="text" id="nama" name="nama" placeholder="Ketik nama kamu..." required>
            <button type="submit">Kirim</button>
        </form>

        {% if nama %}
        <p class="hasil">Halo, <strong>{{ nama }}</strong>! Data diterima lewat method POST.</p>
        {% endif %}
    </div>
</body>
</html>
